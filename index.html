<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Primer Servicio Web</title>
    <!-- Vincula tu archivo CSS aquí -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <h2>Enviar Nombre al Servidor</h2>
        
        <form id="formulario-saludo">
            <div class="form-group">
                <label for="nombre">Ingresa tu nombre:</label>
                <input type="text" id="nombre" placeholder="Ej. Jorge" required>
            </div>
            <button type="submit">Enviar al Servicio Web</button>
        </form>

        <!-- Contenedor de respuesta, inicialmente oculto -->
        <div id="contenedor-respuesta" class="oculto">
            <p id="texto-saludo"></p>
        </div>
    </div>

    <!-- Vincula tu archivo JavaScript aquí -->
    <script src="script.js"></script>
</body>
</html>
